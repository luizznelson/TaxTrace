[project]
name = "taxtrace"
version = "0.0.1"
description = "Agente com servidor MCP para consultar a Reforma Tributária do consumo (IBS/CBS) com citação de fonte e controle de vigência."
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
