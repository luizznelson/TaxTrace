name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
        env:
          POSTGRES_USER: taxtrace_test
          POSTGRES_PASSWORD: test-ci-only
          POSTGRES_DB: taxtrace_test
        ports:
          - 15434:5432
        options: >-
          --health-cmd "pg_isready -U taxtrace_test -d taxtrace_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TAXTRACE_TEST_DATABASE: '1'
      TAXTRACE_TEST_DATABASE_URL: postgresql://taxtrace_test:test-ci-only@127.0.0.1:15434/taxtrace_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/query-input.test.mjs
      - run: ruff check .
      - run: ruff format --check .
